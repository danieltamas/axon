[package]
name = "axon-bus"
description = "Axon's control plane: registry, routed messages and budgets for coding agents across harnesses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
axon-core.workspace = true
anyhow.workspace = true
axum = "0.7"
blake3.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Builds the SSE stream in `serve`; already in the tree as an axum dependency.
futures-util = "0.3"
# The per-boot `serve` token needs OS randomness; already in the tree.
getrandom = "0.2"
# Only `serve` starts a runtime; hooks stay synchronous (BUS-PLAN §2 dependencies).
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
toml.workspace = true
# Edits the owner's Codex config.toml in place, keeping their comments and layout;
# already in the tree as a dependency of `toml`.
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
rusqlite.workspace = true
serde_json.workspace = true

# Not released until it has commands (BUS-PLAN §9, M6).
[package.metadata.dist]
dist = false
