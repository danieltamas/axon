[package]
name = "axon-bus"
description = "Axon's control plane: registry, routed messages and budgets for coding agents across harnesses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
axon-core.workspace = true
anyhow.workspace = true
axum = "0.7"
blake3.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
# Credential shapes in captured narrative (§7 redaction); regex-automata is already in the tree.
regex = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Builds the SSE stream in `serve`; already in the tree as an axum dependency.
futures-util = "0.3"
# The per-boot `serve` token needs OS randomness; already in the tree.
getrandom = "0.2"
# Resident memory of each agent's harness process (BUS-PLAN §2 dependency list).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Only `serve` starts a runtime; hooks stay synchronous (BUS-PLAN §2 dependencies).
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
toml.workspace = true
# Federation transport (docs/P2P-SPEC.md §3): authenticated QUIC with relay fallback and hole
# punching. `tls-ring` is the required crypto backend and keeps the release binary small;
# dropped from the defaults: `portmapper` (UPnP/NAT-PMP, an optional hole-punch aid),
# `metrics` and `fast-apple-datapath` (a macOS throughput tweak).
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# SHA-256 for node fingerprints and pair codes (§3); already in the tree through iroh.
sha2 = "0.11"
# Edits the owner's Codex config.toml in place, keeping their comments and layout;
# already in the tree as a dependency of `toml`.
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
rusqlite.workspace = true
serde_json.workspace = true

# Not released until it has commands (BUS-PLAN §9, M6).
[package.metadata.dist]
dist = false
