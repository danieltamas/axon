[package]
name = "axon-bus"
description = "Axon's control plane: registry, routed messages and budgets for coding agents across harnesses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
axon-core.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
rusqlite.workspace = true
serde_json.workspace = true
# Edits the owner's Codex config.toml in place, keeping their comments and layout;
# already in the tree as a dependency of `toml`.
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
rusqlite.workspace = true
serde_json.workspace = true

# Not released until it has commands (BUS-PLAN §9, M6).
[package.metadata.dist]
dist = false
