<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Axon is not running</title>
<meta name="theme-color" content="#f7f9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a110e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%2334d399' stroke-width='2.2'%3E%3Ccircle cx='5' cy='12' r='2.6'/%3E%3Ccircle cx='19' cy='5' r='2.6'/%3E%3Ccircle cx='19' cy='19' r='2.6'/%3E%3Cpath d='M7.4 10.9 16.6 6.1M7.4 13.1l9.2 4.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pwa.css">
<script type="module" src="/offline.js"></script>
</head>
<body class="offline" data-state="waiting">
<main class="off">
  <svg class="off-mark" viewBox="0 0 120 120" aria-hidden="true">
    <path class="off-wire" d="M33 54 87 27M33 66l54 27"/>
    <circle class="off-node off-core" cx="25" cy="60" r="11"/>
    <circle class="off-node" cx="95" cy="23" r="11"/>
    <circle class="off-node" cx="95" cy="97" r="11"/>
  </svg>
  <h1 class="off-title" id="title">Axon is not running</h1>
  <p class="off-lede" id="lede">This window shows the axon app on this computer. Start it in a terminal and the dashboard comes back by itself.</p>

  <div class="off-command">
    <code id="start">axon</code>
    <button class="off-copy" type="button" data-copy="start" aria-label="Copy the command">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
      <span>Copy</span>
    </button>
  </div>

  <p class="off-status" role="status" aria-live="polite"><span class="off-pulse" aria-hidden="true"></span><span id="status">Waiting for axon on this port</span></p>

  <p class="off-elsewhere" id="elsewhere" hidden>Axon runs on port 7777 unless told otherwise. <a href="/">Open it there</a></p>

  <details class="off-more">
    <summary>Not installed yet?</summary>
    <p>Install the app, then run <code>axon</code>.</p>
    <div class="off-command off-command-small">
      <code id="install"></code>
      <button class="off-copy" type="button" data-copy="install" aria-label="Copy the install command">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
        <span>Copy</span>
      </button>
    </div>
  </details>
</main>
</body>
</html>
