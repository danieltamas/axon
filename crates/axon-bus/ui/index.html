<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="axon-token" content="{{token}}">
<meta name="color-scheme" content="light dark">
<title>Axon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%2334d399' stroke-width='2.2'%3E%3Ccircle cx='5' cy='12' r='2.6'/%3E%3Ccircle cx='19' cy='5' r='2.6'/%3E%3Ccircle cx='19' cy='19' r='2.6'/%3E%3Cpath d='M7.4 10.9 16.6 6.1M7.4 13.1l9.2 4.8'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" aria-label="Axon: all projects">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.6"/><circle cx="19" cy="5" r="2.6"/><circle cx="19" cy="19" r="2.6"/><path d="M7.4 10.9 16.6 6.1M7.4 13.1l9.2 4.8"/></svg>
    <span class="wordmark">AXON</span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
  <div class="bar-end">
    <span class="link" id="link" data-state="connecting">Connecting</span>
    <button class="theme" id="theme" type="button" data-mode="auto" aria-label="Theme: auto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="half" d="M12 4a8 8 0 0 1 0 16Z"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" role="tablist" aria-label="Views">
  <button type="button" role="tab" data-tab="agents" aria-controls="board" aria-selected="true">Agents</button>
  <button type="button" role="tab" data-tab="activity" aria-controls="context" aria-selected="false">Activity</button>
</nav>
<main class="layout" id="layout" data-level="overview" data-view="agents">
  <section class="overview" id="overview" aria-label="Projects"></section>
  <section class="board" id="board" aria-label="Project topology">
    <header class="project-head" id="project-head"></header>
    <svg class="arcs" id="arcs" aria-hidden="true"></svg>
    <div class="tree" id="tree"></div>
  </section>
  <aside class="context" id="context" aria-label="Activity"></aside>
</main>
</body>
</html>
