# Axon pricing table — rates are per 1,000,000 tokens, entered in USD.
# Cost is displayed in EUR via `fx_to_display` (DESIGN.md §8, Appendix B).
# Users can override this file at ~/.config/axon/pricing.toml.
#
# Per-model rates from Anthropic's published pricing (input/output), with the
# standard cache multipliers applied: cache_read = 0.10x input,
# cache_write_5m = 1.25x input, cache_write_1h = 2.00x input.
# Unknown models => "unpriced" (cost is a FLOOR, surfaced loudly, never a silent zero).
# Local models => free.

priced_as_of = "2026-06-15"  # shown in the UI; bump when you update rates
display_currency = "EUR"
# Rates below are in USD; this converts them to the display currency (EUR).
# NOTE: this is an approximate USD->EUR rate — confirm/update it for accurate cost.
fx_to_display = 0.92

# Per model: input, output, cache_read, cache_write_5m, cache_write_1h
# (cache READ is far cheaper than cache WRITE — kept separate; DESIGN.md §8).

[models."claude-opus-4.8"]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write_5m = 6.25
cache_write_1h = 10.0

[models."claude-opus-4.7"]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write_5m = 6.25
cache_write_1h = 10.0

# Same Opus-family rates as 4.7/4.8 (maintainer: confirm if 4.6 differed).
[models."claude-opus-4.6"]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write_5m = 6.25
cache_write_1h = 10.0

[models."claude-sonnet-4.6"]
