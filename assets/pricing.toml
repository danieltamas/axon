# Axon pricing table — rates are per 1,000,000 tokens.
# VERIFY every rate and set `priced_as_of` before trusting cost. Unknown models => "unpriced"
# (cost is a FLOOR, surfaced loudly in the UI — never a silent zero). Local models => free.
# Users can override this file at ~/.config/axon/pricing.toml. (DESIGN.md §8, Appendix B)

priced_as_of = "2026-06-15"  # shown in the UI; bump when you update rates
display_currency = "EUR"
# If the rates below are entered in USD, set this to convert for display:
# fx_to_display = 0.92

# Per model: input, output, cache_read, cache_write_5m, cache_write_1h
# (cache READ is far cheaper than cache WRITE — keep them separate; DESIGN.md §8).
# TODO: fill real rates. 0.0 placeholders below are intentionally wrong so they can't masquerade as truth.

[models."claude-opus-4.8"]
input = 0.0
output = 0.0
cache_read = 0.0
cache_write_5m = 0.0
cache_write_1h = 0.0

[models."claude-sonnet-4.6"]
input = 0.0
output = 0.0
cache_read = 0.0
