# Local/self-hosted models (Ollama, local Qwen via OpenCode): free, NOT "unpriced".
# Any model id beginning with one of these prefixes => cost 0.0, flagged as "local".
[local]
free_prefixes = ["local:", "ollama", "gamerina-ollama"]
