# coord:hooks:start — managed block, do not edit by hand
# Amoeba coordination. Regenerated by setup; anything you add outside these two markers is left alone.
# UserPromptSubmit injects team context before each prompt (spec §5, §8).
# PreToolUse holds an action that needs a teammate's approval (spec §7, §4.4).
[hooks]
UserPromptSubmit = [{ hooks = [{ type = "command", command = "node \"/Applications/Amoeba.app/Contents/Resources/app/amoeba-runtime/daemon/dist/codex-prompt-hook.js\"" }] }]
PreToolUse = [{ hooks = [{ type = "command", command = "node \"/Applications/Amoeba.app/Contents/Resources/app/amoeba-runtime/daemon/dist/codex-pretool-hook.js\"" }] }]
[mcp_servers.coord]
command = "node"
args = ["/Applications/Amoeba.app/Contents/Resources/app/amoeba-runtime/mcp/dist/server.js"]
default_tools_approval_mode = "approve"
# coord:hooks:end
