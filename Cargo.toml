[workspace]
members = [".", "crates/axon-core", "crates/axon-bus"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/danieltamas/axon"
homepage = "https://github.com/danieltamas/axon"
authors = ["Daniel Tamas <hello@danieltamas.ro>"]

[workspace.dependencies]
axon-core = { path = "crates/axon-core", version = "0.4.2" }
rusqlite = { version = "0.31", features = ["bundled"] } # bundled SQLite → static musl-friendly
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] } # ISO-8601 → epoch ms
blake3 = "1"                                        # idempotent Event ids (hash of message.id etc.)
toml = "0.8"                                        # parse pricing.toml (rates per model)

[package]
name = "axon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local, harness-agnostic observability for AI coding agents — one binary, in your browser."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["observability", "ai", "llm", "cost", "claude"]
categories = ["command-line-utilities", "development-tools"]

# Versions are indicative — run `cargo update` and pin during M1.
[dependencies]
axon-core.workspace = true
# The control plane and the dashboard it serves (BUS-PLAN §0b: one app).
axon-bus = { path = "crates/axon-bus" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
notify = "6"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
webbrowser = "1"
anyhow.workspace = true
chrono.workspace = true
toml.workspace = true

# Optional OTEL export. HTTP+rustls ONLY (never gRPC — keeps static musl builds clean). Off by default.
opentelemetry = { version = "0.24", optional = true }
opentelemetry-otlp = { version = "0.17", optional = true, default-features = false, features = ["http-proto", "reqwest-rustls"] }

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp"]

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
